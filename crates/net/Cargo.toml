[package]
name = "snowy-net"
version.workspace = true
edition = "2021"
license = "MIT"
description = "Snowy friends: identity key, connection to the friends server, shared state files; anonymous usage ping."

[dependencies]
snowy-core.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
log.workspace = true
base64 = "0.22"
ed25519-dalek = "2"
sha2 = "0.10"
getrandom = "0.2"
tungstenite = { version = "0.26", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
